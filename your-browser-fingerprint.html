<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Unstoppable Fingerprint Matrix</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #090d16; color: #f1f5f9; text-align: center; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 16px; text-align: left; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        h1 { color: #38bdf8; text-align: center; font-size: 2rem; margin-bottom: 5px; }
        p.sub { text-align: center; color: #94a3b8; margin-bottom: 30px; }
        .hash-box { background: #020617; padding: 15px; border-radius: 8px; font-size: 1.4rem; font-family: monospace; color: #34d399; text-align: center; border: 2px solid #475569; word-break: break-all; margin-bottom: 30px; }
        .section-title { color: #f59e0b; border-bottom: 2px solid #475569; padding-bottom: 5px; margin-top: 30px; font-size: 1.2rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #111827; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; border-bottom: 1px solid #374151; word-break: break-all; font-family: monospace; font-size: 0.9rem; }
        th { color: #38bdf8; width: 35%; background: #1f2937; text-align: left; }
        td { color: #e5e7eb; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔍 Ultimate Unstoppable Fingerprint Matrix</h1>
        <p class="sub">Shield-Proof Sandbox Technology (Instant Load Guaranteed)</p>

        <h3>Your Unique Master Tracker ID:</h3>
        <div class="hash-box" id="fp-id">GENERATING...</div>

        <h2 class="section-title">1. Simulated HTTP & Core Identity Parameters</h2>
        <table id="table-identity"></table>

        <h2 class="section-title">2. Screen & Window Geometry (Inch-To-Inch Metrics)</h2>
        <table id="table-screen"></table>

        <h2 class="section-title">3. Storage, Permissions & Hard Hardware Vectors</h2>
        <table id="table-hardware"></table>
    </div>

    <script>
        // Simple and robust local hashing function
        function safeHash(str) {
            let h = 0;
            for (let i = 0; i < str.length; i++) {
                h = (h << 5) - h + str.charCodeAt(i);
                h |= 0;
            }
            return "NKL-" + Math.abs(h).toString(16).toUpperCase();
        }

        // Safe extractor that wraps everything in a try-catch to prevent freezes
        function safeExtract(fn, fallbackValue = "Blocked / Restricted by Browser") {
            try {
                return fn();
            } catch (e) {
                return fallbackValue;
            }
        }

        window.onload = function() {
            const tableId = document.getElementById('table-identity');
            const tableScreen = document.getElementById('table-screen');
            const tableHardware = document.getElementById('table-hardware');

            const appendRow = (table, key, val) => {
                table.innerHTML += `<tr><th>${key}</th><td>${val}</td></tr>`;
            };

            // --- SECTION 1: IDENTITY ---
            appendRow(tableId, "1. User Agent", safeExtract(() => navigator.userAgent));
            appendRow(tableId, "2. Platform Architecture", safeExtract(() => navigator.platform));
            appendRow(tableId, "3. System Timezone", safeExtract(() => Intl.DateTimeFormat().resolvedOptions().timeZone));
            appendRow(tableId, "4. Content Language", safeExtract(() => navigator.language));
            appendRow(tableId, "5. Do Not Track (DNT)", safeExtract(() => navigator.doNotTrack || "Not Set"));
            appendRow(tableId, "6. Simulated Accept Header", "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8");
            appendRow(tableId, "7. Simulated Content Encoding", "gzip, deflate, br, zstd");
            appendRow(tableId, "8. Upgrade Insecure Requests", "1");
            appendRow(tableId, "9. Referer Context Trace", safeExtract(() => document.referrer || "Direct Visit (No Referer)"));
            appendRow(tableId, "10. Navigator Core Specs", safeExtract(() => `Product: ${navigator.product} | Vendor: ${navigator.vendor || 'N/A'}`));

            // --- SECTION 2: GEOMETRY ---
            appendRow(tableScreen, "11. Screen Dimensions", safeExtract(() => `${screen.width}x${screen.height} (${screen.colorDepth}-bit)`));
            appendRow(tableScreen, "12. Available Screen Space", safeExtract(() => `${screen.availWidth}x${screen.availHeight} (Top: ${screen.availTop || 0}, Left: ${screen.availLeft || 0})`));
            appendRow(tableScreen, "13. Window UI Offsets", safeExtract(() => `Left: ${window.screenLeft}px | Top: ${window.screenTop}px`));
            appendRow(tableScreen, "14. Device Pixel Ratio", safeExtract(() => window.devicePixelRatio || 1));
            appendRow(tableScreen, "15. UI Element: Location Bar", safeExtract(() => window.locationbar.visible ? "Visible" : "Hidden"));
            appendRow(tableScreen, "16. UI Element: Menu Bar", safeExtract(() => window.menubar.visible ? "Visible" : "Hidden"));
            appendRow(tableScreen, "17. UI Element: Personal Bar", safeExtract(() => window.personalbar.visible ? "Visible" : "Hidden"));
            appendRow(tableScreen, "18. UI Element: Status Bar", safeExtract(() => window.statusbar.visible ? "Visible" : "Hidden"));

            // --- SECTION 3: HARDWARE & STORAGE (Most targeted by ad-blockers) ---
            appendRow(tableHardware, "19. Cookies Allowed?", safeExtract(() => navigator.cookieEnabled ? "Yes" : "No"));
            appendRow(tableHardware, "20. Local & Session Storage", safeExtract(() => `Local: ${!!window.localStorage} | Session: ${!!window.sessionStorage}`));
            appendRow(tableHardware, "21. IndexedDB Status", safeExtract(() => typeof indexedDB !== 'undefined' ? "Supported" : "Blocked"));
            
            // Safe Canvas Signature Extraction
            const canvasHash = safeExtract(() => {
                const can = document.createElement('canvas');
                const ctx = can.getContext('2d');
                ctx.fillText("Bypass_Test_2026", 2, 10);
                return safeHash(can.toDataURL());
            }, "Blocked by Anti-Fingerprinting Shield");
            appendRow(tableHardware, "22. Canvas Element Signature Hash", canvasHash);

            // Safe WebGL GPU Extraction
            const gpuModel = safeExtract(() => {
                const can = document.createElement('canvas');
                const gl = can.getContext('webgl') || can.getContext('experimental-webgl');
                if (!gl) return "Unsupported GPU Engine";
                const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                return dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
            }, "Blocked by Anti-Fingerprinting Shield");
            appendRow(tableHardware, "23. WebGL GPU Renderer Model", gpuModel);

            // Safe Audio Context Extraction
            const audioSpec = safeExtract(() => {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return "Unsupported Audio System";
                const ctx = new AudioContext();
                return `${ctx.sampleRate}Hz | Max Channels: ${ctx.destination.maxChannelCount}`;
            }, "Blocked by Anti-Fingerprinting Shield");
            appendRow(tableHardware, "24. Audio Hardware Output Metrics", audioSpec);

            appendRow(tableHardware, "25. CPU Thread Cores Count", safeExtract(() => navigator.hardwareConcurrency || "Hidden"));
            appendRow(tableHardware, "26. Device Memory (RAM)", safeExtract(() => navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "Hidden"));
            appendRow(tableHardware, "27. Touch Screen Detected?", safeExtract(() => ('ontouchstart' in window || navigator.maxTouchPoints > 0) ? "Yes" : "No"));

            // Master Entropy ID Build
            const entropySeed = [navigator.userAgent, screen.width, canvasHash, gpuModel].join('|');
            document.getElementById('fp-id').innerText = safeHash(entropySeed);
        };
    </script>
</body>
</html>
